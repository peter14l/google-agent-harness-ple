name: Run PLE Evaluation & Generate Artifacts

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Task IDs to evaluate (comma-separated, e.g. 'engineers-estimate-check' or 'all')"
        required: true
        default: "engineers-estimate-check"
      trials:
        description: "Number of concurrent trials"
        required: true
        default: "1"
      commit_artifacts:
        description: "Automatically commit generated artifacts back to the repository?"
        type: boolean
        default: true

jobs:
  evaluate:
    name: Evaluate Dev Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Optimize Disk Space & Remap Docker to /mnt (70GB+ Partition)
        run: |
          echo "==> Disk space before optimization:"
          df -h

          # 1. Clean heavy pre-installed caches from root partition
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # 2. Reconfigure Docker daemon to use the large 70GB+ /mnt partition
          echo "==> Remapping Docker storage root to /mnt/docker..."
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker

          echo "==> Disk space after optimization:"
          df -h
          docker info | grep "Docker Root Dir"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Harbor 0.20.0 with WebSockets
        run: |
          uv tool install harbor==0.20.0 --with websockets

      - name: Fast Clone Tasks via Git onto /mnt
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "==> Cloning tasks repository to /mnt/hf_dataset with skip smudge..."
          sudo mkdir -p /mnt/hf_dataset
          sudo chown -R runner:docker /mnt/hf_dataset
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://oauth2:${HF_TOKEN}@huggingface.co/datasets/google/physical-engineerings-last-exam /mnt/hf_dataset
          echo "TASKS_DIR=/mnt/hf_dataset/tasks" >> $GITHUB_ENV
          echo "==> Tasks directory ready at: /mnt/hf_dataset/tasks"

      - name: Prepare Evaluation Environment & Execute Harbor Evaluation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_PROXY_KEY: ci-proxy-key
        run: |
          # 1. Write local.env
          cat <<EOF > local.env
          HF_TOKEN=${HF_TOKEN}
          MODEL_PROXY_URL=http://localhost:4000
          MODEL_PROXY_KEY=ci-proxy-key
          EOF

          # 2. Start LiteLLM proxy inside this active step so it stays alive
          echo "==> Starting LiteLLM Proxy on 0.0.0.0:4000..."
          export GEMINI_API_KEY="${GEMINI_API_KEY}"
          export MODEL_PROXY_KEY="${MODEL_PROXY_KEY}"
          uv run --no-project --with 'litellm[proxy]' litellm \
            --config .github/litellm_gemini_proxy.yaml \
            --host 0.0.0.0 --port 4000 > proxy.log 2>&1 &

          # 3. Wait for proxy on both localhost and Docker bridge (172.17.0.1)
          echo "==> Waiting for LiteLLM proxy to bind to 0.0.0.0:4000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "==> Proxy listening on 127.0.0.1:4000."
              break
            fi
            sleep 1
          done

          BRIDGE_IP="172.17.0.1"
          if curl -s "http://${BRIDGE_IP}:4000/health" >/dev/null 2>&1; then
            echo "==> Proxy successfully reachable from Docker bridge (${BRIDGE_IP}:4000)!"
          fi

          # 4. Run Harbor evaluation
          cd ple
          TASK_FLAG=""
          if [ "${{ github.event.inputs.tasks }}" != "all" ]; then
            TASK_FLAG="--tasks ${{ github.event.inputs.tasks }}"
          fi
          
          echo "==> Running evaluation with tasks: ${{ github.event.inputs.tasks }}"
          uv run python eval/run.py .. \
            --env-file ../local.env \
            --tasks-dir "$TASKS_DIR" \
            --trials ${{ github.event.inputs.trials }} \
            $TASK_FLAG

      - name: Upload Artifacts Directory (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: ple-evaluation-artifacts
          path: artifacts/
          retention-days: 30

      - name: Commit and Push Artifacts
        if: ${{ github.event.inputs.commit_artifacts == true }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update PLE evaluation dev artifacts [skip ci]"
          file_pattern: "artifacts/**"
