name: Run PLE Evaluation & Generate Artifacts

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Task IDs to evaluate (e.g. 'engineers-estimate-check' or 'data-hall-mep-routing')"
        required: true
        default: "engineers-estimate-check"
      trials:
        description: "Number of concurrent trials"
        required: true
        default: "1"
      commit_artifacts:
        description: "Automatically commit generated artifacts back to the repository?"
        type: boolean
        default: true

jobs:
  evaluate:
    name: Evaluate Dev Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Relocate Docker & Caches to /mnt (75GB Dedicated SSD)
        run: |
          echo "==> Initial Disk Layout:"
          df -h

          echo "==> Cleaning root partition..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost

          echo "==> Relocating Docker data-root to /mnt/docker..."
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker /mnt/tmp /mnt/cache/uv /mnt/cache/huggingface /mnt/cache/plebench
          sudo chmod -R 777 /mnt/cache /mnt/tmp
          sudo chown -R runner:docker /mnt/cache /mnt/tmp || true
          sudo chmod 1777 /mnt/tmp

          cat <<'EOF' | sudo tee /etc/docker/daemon.json
          {
            "data-root": "/mnt/docker",
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "2"
            }
          }
          EOF

          sudo systemctl start docker

          echo "==> Disk Layout after relocation:"
          df -h
          docker info | grep "Docker Root Dir"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Harbor 0.20.0 with WebSockets
        run: |
          uv tool install harbor==0.20.0 --with websockets

      - name: Verify Docker Daemon & Resources
        run: |
          docker info
          free -h

      - name: Fast Clone Tasks via Git (Skip Large LFS Assets)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "==> Cloning tasks repository metadata into /mnt/cache/tasks..."
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://oauth2:${HF_TOKEN}@huggingface.co/datasets/google/physical-engineerings-last-exam /mnt/cache/tasks
          echo "TASKS_DIR=/mnt/cache/tasks/tasks" >> $GITHUB_ENV
          echo "==> Tasks directory ready at: /mnt/cache/tasks/tasks"

      - name: Prepare Evaluation Environment & Execute Harbor Evaluation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_PROXY_KEY: ci-proxy-key
          TMPDIR: /mnt/tmp
          UV_CACHE_DIR: /mnt/cache/uv
          HF_HOME: /mnt/cache/huggingface
        run: |
          # 1. Ensure artifacts directory exists
          mkdir -p artifacts

          # 2. Write local.env
          cat <<EOF > local.env
          HF_TOKEN=${HF_TOKEN}
          MODEL_PROXY_URL=http://localhost:4000
          MODEL_PROXY_KEY=ci-proxy-key
          EOF

          # 3. Start LiteLLM proxy inside this active step so it stays alive
          echo "==> Starting LiteLLM Proxy on 0.0.0.0:4000..."
          export GEMINI_API_KEY="${GEMINI_API_KEY}"
          export MODEL_PROXY_KEY="${MODEL_PROXY_KEY}"
          uv run --no-project --with 'litellm[proxy]' litellm \
            --config .github/litellm_gemini_proxy.yaml \
            --host 0.0.0.0 --port 4000 > /mnt/tmp/proxy.log 2>&1 &

          # 4. Wait for proxy on both localhost and Docker bridge (172.17.0.1)
          echo "==> Waiting for LiteLLM proxy to bind to 0.0.0.0:4000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "==> Proxy listening on 127.0.0.1:4000."
              break
            fi
            sleep 1
          done

          BRIDGE_IP="172.17.0.1"
          if curl -s "http://${BRIDGE_IP}:4000/health" >/dev/null 2>&1; then
            echo "==> Proxy successfully reachable from Docker bridge (${BRIDGE_IP}:4000)!"
          fi

          # 5. Run Harbor evaluation
          cd ple
          TASK_FLAG=""
          if [ "${{ github.event.inputs.tasks }}" != "all" ]; then
            TASK_FLAG="--tasks ${{ github.event.inputs.tasks }}"
          fi
          
          echo "==> Running evaluation with tasks: ${{ github.event.inputs.tasks }}"
          uv run python eval/run.py .. \
            --env-file ../local.env \
            --tasks-dir "$TASKS_DIR" \
            --trials ${{ github.event.inputs.trials }} \
            $TASK_FLAG

      - name: Upload Artifacts Directory (Zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ple-evaluation-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and Push Artifacts
        if: ${{ github.event.inputs.commit_artifacts == true && always() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update PLE evaluation dev artifacts [skip ci]"
          file_pattern: "artifacts/**"
