name: Validate Harness (Smoke Test)

on:
  push:
    branches: [main, master]
    paths:
      - 'serve.py'
      - 'submission.yaml'
      - 'agent/**'
      - 'harness/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    name: Kit Check & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Harbor 0.20.0 with WebSockets
        run: |
          uv tool install harbor==0.20.0 --with websockets

      - name: Verify Docker Daemon
        run: |
          docker info

      - name: Start LiteLLM Gemini Model Proxy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_PROXY_KEY: ci-proxy-key
        run: |
          echo "==> Starting LiteLLM Gemini Proxy on port 4000..."
          export GEMINI_API_KEY="${GEMINI_API_KEY}"
          export MODEL_PROXY_KEY="${MODEL_PROXY_KEY}"
          uv run --no-project --with 'litellm[proxy]' litellm \
            --config .github/litellm_gemini_proxy.yaml \
            --host 0.0.0.0 --port 4000 > proxy.log 2>&1 &
          
          # Wait for proxy to initialize
          for i in {1..15}; do
            if curl -s http://localhost:4000/health >/dev/null 2>&1; then
              echo "==> Proxy is healthy and accepting traffic."
              break
            fi
            sleep 1
          done

      - name: Run Kit Validate & Check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          touch local.env
          echo "MODEL_PROXY_URL=http://localhost:4000" >> local.env
          echo "MODEL_PROXY_KEY=ci-proxy-key" >> local.env
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN=$HF_TOKEN" >> local.env
          fi
          
          cd ple
          echo "==> Running python -m kit validate..."
          uv run python -m kit validate ..
          
          echo "==> Running python -m kit check..."
          uv run python -m kit check .. --env-file ../local.env --no-smoke
